name: Build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libavahi-client-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Protocol tests
        run: cargo test -p switcher-protocol

      - name: Hub tests
        run: cargo test -p hub

      - name: Matter build
        run: cargo check -p hub --features matter

      - name: Dongle build
        run: cargo check-dongle
